<!DOCTYPE html>

<html dir="auto">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إلى عروستي ❤️</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    overflow-x:hidden;

    font-family:"Cairo",sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 50% 35%,
            #562132 0%,
            #28121c 45%,
            #09070a 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    padding:20px;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{

    content:"";

    position:fixed;

    width:600px;
    height:600px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,110,150,.12),
            transparent 70%
        );

    pointer-events:none;
}

.bg-heart{

    position:fixed;

    color:rgba(255,160,190,.06);

    font-size:80px;

    pointer-events:none;

    animation:float 8s ease-in-out infinite;
}

.h1{
    left:6%;
    top:10%;
}

.h2{
    right:6%;
    top:20%;
    animation-delay:2s;
}

.h3{
    left:15%;
    bottom:8%;
    animation-delay:4s;
}

.h4{
    right:12%;
    bottom:6%;
    animation-delay:1s;
}

@keyframes float{

    0%,100%{
        transform:translateY(0) rotate(-10deg);
    }

    50%{
        transform:translateY(-25px) rotate(10deg);
    }
}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:100%;

    max-width:650px;

    position:relative;

    z-index:5;

    text-align:center;
}


/* =====================================================
   INTRO
===================================================== */

.intro{

    margin-bottom:15px;

    transition:.5s;
}

.intro h1{

    font-family:"Playfair Display",serif;

    font-size:34px;

    margin-bottom:8px;
}

.intro p{

    color:#e8b8c8;

    font-size:15px;
}


/* =====================================================
   ATTEMPT
===================================================== */

.attempt{

    color:#d99bad;

    font-size:13px;

    margin-bottom:5px;
}


/* =====================================================
   LOCK
===================================================== */

.lock-area{

    height:280px;

    display:flex;

    align-items:center;

    justify-content:center;
}

.lock{

    width:145px;
    height:170px;

    position:relative;

    cursor:pointer;

    user-select:none;

    filter:
        drop-shadow(
            0 0 25px
            rgba(255,70,120,.3)
        );
}

.lock-body{

    position:absolute;

    bottom:10px;
    left:10px;

    width:125px;
    height:105px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #e0b85e,
            #8d5b18
        );

    border:4px solid #f5d477;

    box-shadow:
        inset 0 5px 10px rgba(255,255,255,.25),
        0 15px 30px rgba(0,0,0,.45);
}

.lock-body::before{

    content:"";

    position:absolute;

    width:25px;
    height:25px;

    background:#3a2110;

    border-radius:50%;

    top:38px;
    left:46px;

    box-shadow:
        0 0 0 5px #d8ad58;
}

.lock-body::after{

    content:"";

    position:absolute;

    width:8px;
    height:25px;

    background:#d8ad58;

    left:54px;
    top:58px;

    border-radius:5px;
}

.lock-shackle{

    position:absolute;

    width:75px;
    height:80px;

    border:16px solid #d4a84f;

    border-bottom:0;

    border-radius:45px 45px 0 0;

    top:5px;
    left:35px;
}


/* =====================================================
   SHAKE
===================================================== */

.shake{
    animation:shake .45s;
}

@keyframes shake{

    0%{
        transform:translateX(0) rotate(0);
    }

    15%{
        transform:translateX(-14px) rotate(-6deg);
    }

    30%{
        transform:translateX(14px) rotate(6deg);
    }

    45%{
        transform:translateX(-12px) rotate(-5deg);
    }

    60%{
        transform:translateX(12px) rotate(5deg);
    }

    75%{
        transform:translateX(-6px);
    }

    100%{
        transform:translateX(0) rotate(0);
    }
}


/* =====================================================
   HINT
===================================================== */

.hint{

    color:#f0c5d0;

    font-size:14px;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    50%{
        opacity:.4;
    }
}


/* =====================================================
   POPUP
===================================================== */

.popup-overlay{

    position:fixed;

    inset:0;

    background:
        rgba(5,3,6,.72);

    backdrop-filter:blur(7px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:100;

    opacity:0;

    visibility:hidden;

    transition:.3s;
}

.popup-overlay.show{

    opacity:1;

    visibility:visible;
}

.popup{

    width:min(430px,100%);

    background:
        linear-gradient(
            145deg,
            #35141f,
            #1d0d15
        );

    border:1px solid rgba(255,190,210,.25);

    border-radius:28px;

    padding:32px 25px 27px;

    text-align:center;

    box-shadow:
        0 30px 90px rgba(0,0,0,.6),
        0 0 40px rgba(220,70,110,.12);

    transform:scale(.8) translateY(20px);

    transition:.35s;
}

.popup-overlay.show .popup{

    transform:scale(1) translateY(0);
}

.popup-emoji{

    font-size:55px;

    display:block;

    margin-bottom:12px;

    animation:popupEmoji 1s ease;
}

@keyframes popupEmoji{

    0%{
        transform:scale(.3) rotate(-20deg);
    }

    70%{
        transform:scale(1.15) rotate(5deg);
    }

    100%{
        transform:scale(1) rotate(0);
    }
}

.popup-text{

    color:#f5d8df;

    line-height:2;

    font-size:16px;

    margin-bottom:22px;
}


/* =====================================================
   BUTTON
===================================================== */

.btn{

    border:1px solid rgba(255,180,200,.45);

    background:
        linear-gradient(
            135deg,
            #8e284e,
            #c24b70
        );

    color:white;

    padding:12px 25px;

    border-radius:50px;

    font-family:inherit;

    font-size:14px;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(0,0,0,.3);

    transition:.25s;
}

.btn:hover{

    transform:translateY(-3px);

    box-shadow:
        0 12px 30px
        rgba(194,75,112,.35);
}

.btn:active{

    transform:scale(.95);
}


/* =====================================================
   CARD WRAPPER
===================================================== */

.card-wrapper{

    display:none;

    width:100%;

    animation:cardAppear 1s ease forwards;
}

@keyframes cardAppear{

    from{
        opacity:0;
        transform:translateY(50px) scale(.88);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}


/* =====================================================
   GREETING CARD
===================================================== */

.greeting-card{

    width:100%;

    max-width:590px;

    min-height:720px;

    margin:auto;

    position:relative;

    overflow:hidden;

    border-radius:30px;

    background:

        radial-gradient(
            circle at 50% 25%,
            #fffefa 0%,
            #fff7ed 55%,
            #f4dfcd 100%
        );

    color:#542b35;

    border:2px solid #d5ad6d;

    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 0 0 8px rgba(213,173,109,.12);

    padding:42px 28px 45px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;
}


/* =====================================================
   CARD DECORATION
===================================================== */

.card-corner{

    position:absolute;

    font-size:50px;

    color:#c79652;

    opacity:.45;
}

.corner-top-left{
    top:10px;
    left:15px;
}

.corner-top-right{
    top:10px;
    right:15px;
}

.corner-bottom-left{
    bottom:10px;
    left:15px;
}

.corner-bottom-right{
    bottom:10px;
    right:15px;
}

.flower{

    position:absolute;

    color:#d69aab;

    opacity:.45;

    font-size:25px;
}

.flower-1{
    left:35px;
    top:230px;
}

.flower-2{
    right:35px;
    top:250px;
}

.flower-3{
    left:55px;
    bottom:125px;
    font-size:18px;
}

.flower-4{
    right:55px;
    bottom:135px;
    font-size:18px;
}


/* =====================================================
   CARD HEADER
===================================================== */

.card-small-title{

    font-size:11px;

    letter-spacing:3px;

    color:#b28348;

    margin-bottom:5px;
}

.card-title{

    font-family:"Playfair Display",serif;

    font-size:30px;

    color:#7d3048;

    margin-bottom:3px;
}

.card-subtitle{

    font-size:13px;

    color:#a87882;

    margin-bottom:3px;
}

.decor-line{

    width:130px;

    height:2px;

    margin:14px auto 5px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #c99b59,
            transparent
        );

    position:relative;
}

.decor-line::after{

    content:"♥";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:#fff8ef;

    color:#b35b72;

    padding:0 8px;

    font-size:12px;
}


/* =====================================================
   MAWLID BRIDE
===================================================== */

.mawlid-bride{

    width:250px;

    height:355px;

    position:relative;

    flex-shrink:0;

    margin:4px auto 3px;

    animation:
        brideFloat 3.5s ease-in-out infinite;

    filter:
        drop-shadow(
            0 15px 15px
            rgba(90,35,50,.15)
        );
}

.bride-svg{

    width:100%;
    height:100%;

    display:block;

    overflow:visible;
}

@keyframes brideFloat{

    0%,100%{
        transform:translateY(0) rotate(-1deg);
    }

    50%{
        transform:translateY(-7px) rotate(1deg);
    }
}


/* =====================================================
   MESSAGE
===================================================== */

.main-message{

    width:100%;

    max-width:500px;

    font-size:23px;

    line-height:2;

    color:#63313e;

    text-align:center;

    margin-top:0;

    margin-bottom:15px;

    min-height:92px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    transition:.3s;
}

.translation{

    font-size:12px;

    color:#b07c87;

    margin-bottom:16px;
}


/* =====================================================
   LANGUAGE BUTTON
===================================================== */

.language-btn{

    background:transparent;

    border:1px solid #c99b66;

    color:#8e4c5d;

    padding:9px 20px;

    border-radius:30px;

    font-family:inherit;

    font-size:12px;

    cursor:pointer;

    transition:.25s;

    flex-shrink:0;
}

.language-btn:hover{

    background:#8e4c5d;

    color:white;

    transform:translateY(-2px);
}


/* =====================================================
   FOOTER SPACE
===================================================== */

.card-footer-space{

    flex:1;

    min-height:35px;
}

.card-footer{

    margin-top:18px;

    font-family:"Playfair Display",serif;

    font-size:14px;

    color:#9e6671;

    padding-top:12px;
}

.card-footer span{
    color:#b34d6c;
}


/* =====================================================
   BROKEN LOCK
===================================================== */

.broken .lock-shackle{

    animation:
        breakShackle .8s forwards;
}

.broken .lock-body{

    animation:
        breakBody .8s forwards;
}

@keyframes breakShackle{

    0%{
        transform:rotate(0);
    }

    40%{
        transform:rotate(-10deg) scale(1.1);
    }

    100%{
        transform:
            translate(-100px,-80px)
            rotate(-45deg);

        opacity:0;
    }
}

@keyframes breakBody{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.15);
    }

    100%{
        transform:
            translate(100px,80px)
            rotate(35deg);

        opacity:0;
    }
}


/* =====================================================
   FLASH
===================================================== */

.flash{

    position:fixed;

    inset:0;

    background:white;

    z-index:150;

    pointer-events:none;

    animation:flash .5s forwards;
}

@keyframes flash{

    0%{
        opacity:.9;
    }

    100%{
        opacity:0;
    }
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti{

    position:fixed;

    width:8px;
    height:14px;

    top:-20px;

    z-index:120;

    animation:fall linear forwards;
}

@keyframes fall{

    to{
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}


/* =====================================================
   HEARTS
===================================================== */

.flying-heart{

    position:fixed;

    pointer-events:none;

    z-index:125;

    font-size:25px;

    animation:flyHeart 2.5s ease-out forwards;
}

@keyframes flyHeart{

    0%{
        transform:
            translate(0,0)
            scale(.5);

        opacity:1;
    }

    100%{
        transform:
            translate(
                calc((var(--x) - .5) * 500px),
                -400px
            )
            scale(1.5);

        opacity:0;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    body{

        padding:12px;

        align-items:center;
    }

    .container{
        width:100%;
    }

    .intro h1{
        font-size:26px;
    }

    .intro p{
        font-size:13px;
    }

    .lock-area{
        height:245px;
    }

    .popup{
        padding:28px 20px 24px;
    }

    .popup-text{
        font-size:14px;
    }

    .greeting-card{

        min-height:680px;

        height:auto;

        padding:
            30px 15px
            38px;

        border-radius:25px;
    }

    .card-small-title{
        font-size:10px;
    }

    .card-title{
        font-size:24px;
    }

    .card-subtitle{
        font-size:12px;
    }

    .decor-line{
        margin-top:11px;
    }

    .mawlid-bride{

        width:210px;

        height:300px;

        margin-top:0;

        margin-bottom:2px;
    }

    .main-message{

        font-size:19px;

        line-height:1.9;

        min-height:90px;

        padding:0 5px;
    }

    .language-btn{

        font-size:11px;

        padding:9px 17px;
    }

    .card-footer-space{
        min-height:28px;
    }

    .card-footer{
        margin-top:15px;
        font-size:13px;
    }

    .flower{
        display:none;
    }

    .card-corner{
        font-size:38px;
    }

    .corner-top-left{
        left:8px;
        top:5px;
    }

    .corner-top-right{
        right:8px;
        top:5px;
    }

    .corner-bottom-left{
        left:8px;
        bottom:5px;
    }

    .corner-bottom-right{
        right:8px;
        bottom:5px;
    }
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:380px){

    body{
        padding:8px;
    }

    .greeting-card{

        min-height:630px;

        padding:
            25px 10px
            30px;
    }

    .card-title{
        font-size:22px;
    }

    .mawlid-bride{

        width:185px;

        height:265px;
    }

    .main-message{

        font-size:17px;

        line-height:1.8;
    }

    .card-footer-space{
        min-height:20px;
    }
}


/* =====================================================
   SHORT SCREEN
===================================================== */

@media(max-height:750px){

    .greeting-card{

        min-height:650px;

        padding-top:25px;

        padding-bottom:30px;
    }

    .mawlid-bride{

        width:190px;

        height:270px;
    }

    .main-message{

        font-size:18px;

        min-height:75px;
    }
}

</style>

</head>

<div

>

    운명은 나를 너와 만나게 했고
    너는 내 인생에서 가장 아름다운 운명이 되었어 ❤️

    <br>

    생일 축하해, 언제나 나의 신부가 되어줘 🥰

<!-- =====================================================
     POPUP
===================================================== -->

<div
    class="popup-overlay"
    id="popupOverlay"
>


<div class="popup">

    <span
        class="popup-emoji"
        id="popupEmoji"
    >
        😂
    </span>

    <div
        class="popup-text"
        id="popupText"
    ></div>

    <button
        class="btn"
        onclick="closePopup()"
        id="popupButton"
    >
        أحاول تاني 😤
    </button>

</div>


</div>

<script>

/* =====================================================
   VARIABLES
===================================================== */

let attempt = 1;

let locked = false;

let korean = true;


/* =====================================================
   ELEMENTS
===================================================== */

const lock =
    document.getElementById("lock");

const lockArea =
    document.getElementById("lockArea");

const intro =
    document.getElementById("intro");

const attemptText =
    document.getElementById("attempt");

const hint =
    document.getElementById("hint");

const cardWrapper =
    document.getElementById("cardWrapper");

const popupOverlay =
    document.getElementById("popupOverlay");

const popupEmoji =
    document.getElementById("popupEmoji");

const popupText =
    document.getElementById("popupText");

const popupButton =
    document.getElementById("popupButton");

const mainMessage =
    document.getElementById("mainMessage");

const languageBtn =
    document.getElementById("languageBtn");

const translation =
    document.getElementById("translation");


/* =====================================================
   HIT LOCK
===================================================== */

function hitLock(){

    if(locked)
        return;

    locked = true;

    lock.classList.remove("shake");

    void lock.offsetWidth;

    lock.classList.add("shake");


    setTimeout(()=>{

        /* FIRST */

        if(attempt === 1){

            showPopup(
                "😂",
                `
                إيه ده؟! 😭<br>
                دي كانت محاولة ولا بتطبطبي عليه؟ 😂<br>
                القفل حتى محسش بحاجة!
                `
            );

        }

        /* SECOND */

        else if(attempt === 2){

            showPopup(
                "😭💪",
                `
                لا لا لا… كده الموضوع خطر 😂<br>
                شكلك مش بتاكلي كويس خالص!<br>
                فين القوة يا بنتي؟ 😭💪
                `
            );

        }

        /* THIRD */

        else{

            breakLock();

        }

    },500);

}


/* =====================================================
   SHOW POPUP
===================================================== */

function showPopup(
    emoji,
    text
){

    popupEmoji.innerHTML = emoji;

    popupText.innerHTML = text;

    popupButton.innerHTML =
        "أحاول تاني 😤";

    popupOverlay.classList.add("show");

}


/* =====================================================
   CLOSE POPUP
===================================================== */

function closePopup(){

    popupOverlay.classList.remove("show");

    attempt++;

    attemptText.innerText =
        "المحاولة " +
        attempt +
        " من 3";

    locked = false;


    if(attempt === 2){

        hint.innerHTML =
            "💥 المرة دي دوسي أقوى!";

    }

    else if(attempt === 3){

        hint.innerHTML =
            "💣 آخر فرصة… فجّريه يا ريما!";

    }

}


/* =====================================================
   CLOSE POPUP WHEN CLICK OUTSIDE
===================================================== */

popupOverlay.addEventListener(
    "click",
    function(e){

        if(e.target === popupOverlay){

            closePopup();

        }

    }
);


/* =====================================================
   BREAK LOCK
===================================================== */

function breakLock(){

    locked = true;


    /* Flash */

    const flash =
        document.createElement("div");

    flash.className = "flash";

    document.body.appendChild(flash);


    /* Break */

    lockArea.classList.add("broken");


    hint.style.display = "none";

    attemptText.style.display = "none";

    intro.style.display = "none";


    createConfetti();

    createHearts();


    setTimeout(()=>{

        lockArea.style.display = "none";

        cardWrapper.style.display = "block";

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    },850);

}


/* =====================================================
   CONFETTI
===================================================== */

function createConfetti(){

    for(let i=0;i<120;i++){

        const confetti =
            document.createElement("div");

        confetti.className =
            "confetti";

        confetti.style.left =
            Math.random()*100+"vw";

        confetti.style.animationDuration =
            (2+Math.random()*3)+"s";

        confetti.style.animationDelay =
            Math.random()*1.5+"s";

        confetti.style.transform =
            `rotate(${Math.random()*360}deg)`;

        document.body.appendChild(confetti);


        setTimeout(()=>{

            confetti.remove();

        },6000);

    }

}


/* =====================================================
   HEARTS
===================================================== */

function createHearts(){

    const hearts = [
        "❤️",
        "💗",
        "💖",
        "💕",
        "💞",
        "✨"
    ];


    for(let i=0;i<45;i++){

        const heart =
            document.createElement("div");

        heart.className =
            "flying-heart";

        heart.innerHTML =
            hearts[
                Math.floor(
                    Math.random() *
                    hearts.length
                )
            ];

        heart.style.left = "50%";

        heart.style.top = "50%";

        heart.style.setProperty(
            "--x",
            Math.random()
        );

        heart.style.animationDelay =
            Math.random()*.8+"s";

        document.body.appendChild(heart);


        setTimeout(()=>{

            heart.remove();

        },3500);

    }

}


/* =====================================================
   LANGUAGE TOGGLE
===================================================== */

function toggleLanguage(){

    korean = !korean;


    if(korean){

        mainMessage.innerHTML = `

            운명은 나를 너와 만나게 했고
            너는 내 인생에서 가장 아름다운 운명이 되었어 ❤️

            <br>

            생일 축하해, 언제나 나의 신부가 되어줘 🥰

        `;

        mainMessage.setAttribute(
            "dir",
            "ltr"
        );

        languageBtn.innerHTML =
            "اضغطي هنا لو مش فاهمة بالكوري 😂";

    }

    else{

        mainMessage.innerHTML = `

            جمعني القدر بكِ، فكنتِ أجمل أقداري ❤️

            <br>

            كل مولد وأنتِ عروستي 🥰

        `;

        mainMessage.setAttribute(
            "dir",
            "rtl"
        );

        languageBtn.innerHTML =
            "نرجع للكوري تاني 🇰🇷😂";

    }

}

</script>
